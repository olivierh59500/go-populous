plugins {
    id "com.android.application"
}

def populousVersionName = file("../../VERSION").text.trim()

android {
    namespace "com.olivierh.populous"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.olivierh.populous"
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName populousVersionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            // Direct loading avoids an extra installed copy of the Go engine.
            // AGP 8.10 aligns uncompressed libraries for 16 KiB devices.
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/populous.aar")
}
