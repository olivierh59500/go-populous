plugins {
    id "com.android.application"
}

android {
    namespace "com.olivierh.populous"
    compileSdk 36
    buildToolsVersion "36.0.0"
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.olivierh.populous"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/populous.aar")
}
